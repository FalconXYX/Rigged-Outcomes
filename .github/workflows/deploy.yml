# Build the static site (web/) and publish it to GitHub Pages: on a push to main, or by hand. Nothing else runs on
# GitHub. The backend is the Cloudflare Worker and the Vercel step function (docs/BACKEND.md), and the site reads
# what they publish (every market, the Watchlist's lists) from the Worker as it loads, so an add or a day's lists
# never need a build.
#
# One-time setup (see docs/DEPLOY.md), or the deploy job is rejected:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions", and "Enforce HTTPS" (the API answers
#      https://parthjain.ca only).
#   2. Settings → Environments → github-pages → Deployment branches: add "main".
#   3. The repository variables API_URL (the Worker's address) and TURNSTILE_SITEKEY (the bot check's site key).
#      With neither set, the site makes no API call and has no markets to show.
# The site is served at https://parthjain.ca/Rigged-Outcomes/ (Vite base "./" + hash routing, so no path
# configuration is needed here).

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build (which installs packages from npm) reads the repository only; the Pages permissions belong
# to the deploy job alone.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm not answering is tried 3 times, a minute apart
      - name: Install web dependencies
        working-directory: web
        run: |
          for try in 1 2 3; do
            npm ci && exit 0
            if [ "$try" -lt 3 ]; then echo "::warning::npm ci failed (try $try of 3); trying again in 60 s"; sleep 60; fi
          done
          exit 1

      - name: Type-check and build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; let an in-progress production deploy finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    # Tried twice, a minute apart: a Pages hiccup passes; a deploy refused twice (the environment's rules, say)
    # fails the run
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait a minute before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (second try)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
