# The daily Watchlist lists, the site owner's decisions and the markets visitors add to the main page
# (docs/DEPLOY.md). One full run a day that builds and publishes this site's own data, a catch-up run 6 hours
# later, and a light "apply" run only when the owner asks for one (the review page, or the Actions tab).
#
#   full   the owner's decisions, the Recently closed list (the last 2 UTC days), the Open now list, the
#          markets sent with "Add to main page", then the site's deploy
#   apply  only the owner's decisions (the reviewed day rebuilt) and the markets to add, then the deploy. It
#          first asks the API whether anything waits (the `check` job, one curl call): with nothing, the run
#          ends there in seconds and deploys nothing. It also stands aside while another run of this
#          workflow is going or waiting (the next daily run picks the work up), so it never takes the place
#          of a daily run waiting for the `watchlist` concurrency group
#   catchup  6 hours after full: only the Open now stories that day's run left unread (its budget ran out, or
#          the model was busy), that day's list rebuilt from its stored searches, and the deploy only when the
#          list changed. Its check reads what is left from the saved state's head and stands aside like apply's;
#          with nothing left, or no list made today yet, it ends there
#
# Everything the job keeps lives in the D1 database, through the API's job endpoints (watchlist/state.py,
# watchlist/blobs.py): its memory between runs, the published lists, the news searches cache and the markets
# added to the main page (each one's built page). The memory is restored first and saved after the lists, so
# a fresh runner starts from yesterday. The job never writes to git: no commits, no pushes, on any branch.
#
# A run ends green unless a person must fix something (watchlist/problems.py): a missing secret or variable, a
# refused job token or Gemini key (the setup check, the first step, says which in one line), or a problem of the
# code (a crash, its traceback in its step's log; a model or a Polymarket request a service says is gone or
# wrong; requirements.lock failing while PyPI answers), one ::error:: line each from the last step. Anything
# else that goes wrong outside the code is handled: a service that still does not answer after its retries
# (Polymarket, Google News, the model, the API, PyPI), a step stopped at its time limit, no saved state in a
# fresh database (the run starts fresh). The list it hit keeps its last version, the other one still publishes,
# and the report (the review page's status) and the run's summary say what happened; the deploy after it is
# left out rather than failed when PyPI or npm do not answer (soft). Nothing assumes the run starts on time:
# GitHub often starts it hours late, and the lists count the UTC day the run is in.
#
# One-time setup (docs/DEPLOY.md): the secrets GEMINI_API_KEY and WATCHLIST_JOB_TOKEN and the variable API_URL
# (the Worker's address), all required, and the job's memory moved into the database once from the Mac
# (`python3 -m watchlist.state migrate`). GitHub turns schedules off after 60 days without activity in the
# repository; the review page warns when no daily run has reported for 40 hours.

name: Watchlist

on:
  schedule:
    - cron: "17 4 * * *"            # full: about 04:17 UTC; off the hour (GitHub delays on-the-hour schedules)
    - cron: "17 10 * * *"           # catchup (MODE below)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = the daily lists; apply = only the owner's decisions and the markets to add; catchup = only what today's run left unread"
        type: choice
        options: [full, apply, catchup]
        default: full

permissions:
  contents: read                    # the checkout; the job writes only to the API

# The API's address and the job's token are given only to the steps that call the API (the check, restoring
# and saving the state, fetching the work, adding markets, the report), never to the installs or the list steps.
env:
  PYTHONUNBUFFERED: "1"
  MODE: ${{ inputs.mode || (github.event.schedule == '17 10 * * *' && 'catchup') || 'full' }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    if: inputs.mode == 'apply' || inputs.mode == 'catchup' || github.event.schedule == '17 10 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read                   # gh run list
    outputs:
      work: ${{ steps.work.outputs.work }}
    steps:
      - name: Ask the API whether anything waits
        id: work
        env:
          API_URL: ${{ vars.API_URL }}
          WATCHLIST_JOB_TOKEN: ${{ secrets.WATCHLIST_JOB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "work=false" >> "$GITHUB_OUTPUT"
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watchlist.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length") || busy=0
          if [ "${busy:-0}" != 0 ]; then
            echo "Another Watchlist run is going or waiting: nothing now (the next daily run takes up what waits)."
            exit 0
          fi
          if [ -z "$API_URL" ] || [ -z "$WATCHLIST_JOB_TOKEN" ]; then
            echo "No API configured: nothing to do."
            exit 0
          fi
          if [ "$MODE" = catchup ]; then
            # what today's list left unread, from the saved state's head (watchlist/state.py open_left)
            if ! head=$(printf 'Authorization: Bearer %s\n' "$WATCHLIST_JOB_TOKEN" |
                        curl -fsS --max-time 30 --retry 3 -H @- -H "Accept: application/json" \
                          -A rigged-outcomes-job "${API_URL%/}/api/job/blobs/state"); then
              echo "::warning::The API did not give the saved state; no catch-up now."
              exit 0
            fi
            n=$(jq --arg day "$(date -u +%F)" '.meta.open_left // {} | if .day == $day then .unread // 0 else 0 end' \
                  <<<"$head") || n=0
            echo "Left unread by today's list: ${n:-0} (0 when no list was made today yet)."
            if [ "${n:-0}" -gt 0 ]; then echo "work=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          # the token goes to curl on stdin, never on its command line
          if ! work=$(printf 'Authorization: Bearer %s\n' "$WATCHLIST_JOB_TOKEN" |
                      curl -fsS --max-time 30 --retry 3 -H @- -H "Accept: application/json" \
                        -A rigged-outcomes-job "${API_URL%/}/api/job/work"); then
            echo "::warning::The API did not answer; the next run tries again."
            exit 0
          fi
          if ! n=$(jq '(.decisions // [] | length) + ([.requests // [] | .[] | select(.status == "approved")] | length)' <<<"$work"); then
            echo "::warning::The API's answer was not the work it lists; the next run tries again."
            exit 0
          fi
          echo "Waiting: $n decision(s) and market(s) to add."
          if [ "${n:-0}" -gt 0 ]; then echo "work=true" >> "$GITHUB_OUTPUT"; fi

  lists:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'skipped' || needs.check.outputs.work == 'true') }}
    concurrency:
      group: watchlist                # never two writers of the saved state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355                # GitHub's own limit is 360; the open list's budget leaves room for the rest
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # exact versions with their hashes: a changed release on PyPI can't be installed by a job with the API's
      # token. Three tries a minute apart; PyPI still down is an outside problem (the run stays green). When PyPI
      # answers (pip fetches a package) and a fourth try still fails, the fault is requirements.lock's: broken
      - name: Install Python dependencies
        id: install
        continue-on-error: true
        timeout-minutes: 15
        run: |
          for try in 1 2 3; do
            pip install --require-hashes -r requirements.lock && exit 0
            if [ "$try" -lt 3 ]; then echo "::warning::pip install failed (try $try of 3); trying again in 60 s"; sleep 60; fi
          done
          if pip download --no-deps --no-cache-dir -q -d "$RUNNER_TEMP/pypi-probe" pip; then
            pip install --require-hashes -r requirements.lock && exit 0
            echo "broken=true" >> "$GITHUB_OUTPUT"
          fi
          exit 1

      # The only step that fails the run for the setup, with one clear message: the secrets and the variable
      # set, the API accepting the job token, Google not calling the Gemini key invalid (watchlist/preflight.py)
      - name: Check the setup
        id: preflight
        if: steps.install.outcome == 'success'
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WATCHLIST_API_URL: ${{ vars.API_URL }}
          WATCHLIST_JOB_TOKEN: ${{ secrets.WATCHLIST_JOB_TOKEN }}
        run: python3 -m watchlist.preflight

      # The state, the lists and the news cache from the database, waiting out an API outage of about 14 minutes.
      # Fails (and the lists are not made: they need the state) when the API still does not answer, refuses the
      # token or holds a damaged state; with no state saved yet the run starts fresh
      - name: Restore the state and the published lists
        id: pull
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        env:
          WATCHLIST_API_URL: ${{ vars.API_URL }}
          WATCHLIST_JOB_TOKEN: ${{ secrets.WATCHLIST_JOB_TOKEN }}
        run: python3 -m watchlist.state pull

      - name: Fetch the owner's decisions, the markets to add and the watchlist
        id: work
        if: steps.pull.outcome == 'success' && env.MODE != 'catchup'
        continue-on-error: true
        timeout-minutes: 10
        env:
          WATCHLIST_API_URL: ${{ vars.API_URL }}
          WATCHLIST_JOB_TOKEN: ${{ secrets.WATCHLIST_JOB_TOKEN }}
        run: python3 -m watchlist.sync pull

      - name: Apply the owner's decisions
        id: decide
        if: steps.pull.outcome == 'success' && steps.work.outputs.decisions == 'true'
        continue-on-error: true
        timeout-minutes: 45                 # an apply-mode rebuild stops itself at its 30-minute budget
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -m watchlist.sync decide --mode "$MODE" --budget-minutes 30

      # The list stops itself at its 30-minute budget (no model request or news search starts after it); the 15
      # minutes to the step's timeout cover the requests still in flight then
      - name: Recently closed list
        id: closed
        if: steps.pull.outcome == 'success' && env.MODE == 'full'
        continue-on-error: true
        timeout-minutes: 45
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -m watchlist.upsets --days 2 --watched data/watchlist/work.json --budget-minutes 30

      # The list stops itself at its budget (no step reading starts in its last 20 minutes, which are kept for
      # the "already out" readings), makes the day's list from what was read and leaves the rest for the next
      # run. 30 minutes after the budget, for the requests still in flight then, `timeout` stops it whatever it is
      # doing (SIGTERM, then SIGKILL a minute later: recorded as stopped, an outside problem). The budget is 180
      # minutes (120 for a catch-up), less when the steps before took long, so the open list ends by minute 256
      # of the job and the steps after it (saving 30, adding 40, the report 15, the publish decision 2, the
      # verdict 5) always get their time inside the job's 355 minutes
      - name: Open now list
        id: open
        if: steps.pull.outcome == 'success' && (env.MODE == 'full' || env.MODE == 'catchup')
        continue-on-error: true
        timeout-minutes: 215
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          left=$(( 225 - ($(date +%s) - STARTED) / 60 ))
          budget=$(( left < 180 ? left : 180 ))
          if [ "$budget" -lt 30 ]; then budget=30; fi
          catch_up=()
          if [ "$MODE" = catchup ]; then catch_up=(--catch-up); budget=$(( budget < 120 ? budget : 120 )); fi
          echo "budget: $budget minutes; stopped $(( budget + 30 )) minutes from now at the latest"
          timeout -k 60 "$(( budget + 30 ))m" \
            python3 -m watchlist.opennow --budget-minutes "$budget" "${catch_up[@]}" --report data/watchlist/open_report.json

      # The state, the lists and the news cache to the database, waiting out an API outage of up to about 14
      # minutes. Refuses when the saved state changed since the pull (a Mac run overlapped): the other run's
      # save is kept, and this run's work is redone by the next run
      - name: Save the state and the lists
        id: save
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          WATCHLIST_API_URL: ${{ vars.API_URL }}
          WATCHLIST_JOB_TOKEN: ${{ secrets.WATCHLIST_JOB_TOKEN }}
        run: python3 -m watchlist.state push --by github --run-url "$RUN_URL"

      - name: Add the markets sent to the main page
        id: add
        if: steps.pull.outcome == 'success' && steps.work.outputs.requests == 'true'
        continue-on-error: true
        timeout-minutes: 40
        env:
          WATCHLIST_API_URL: ${{ vars.API_URL }}
          WATCHLIST_JOB_TOKEN: ${{ secrets.WATCHLIST_JOB_TOKEN }}
        run: python3 -m watchlist.sync add

      # The status (success, partial, failure) and the problems come from the steps' outcomes and what each
      # step recorded (watchlist/problems.py)
      - name: Report to the API
        id: report
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          WATCHLIST_API_URL: ${{ vars.API_URL }}
          WATCHLIST_JOB_TOKEN: ${{ secrets.WATCHLIST_JOB_TOKEN }}
        run: |
          python3 -m watchlist.sync push --mode "$MODE" --status success \
            --started-at "${{ steps.started.outputs.at }}" --run-url "$RUN_URL" \
            --outcome pull=${{ steps.pull.outcome }} --outcome work=${{ steps.work.outcome }} \
            --outcome decide=${{ steps.decide.outcome }} --outcome closed=${{ steps.closed.outcome }} \
            --outcome open=${{ steps.open.outcome }} --outcome save=${{ steps.save.outcome }} \
            --outcome add=${{ steps.add.outcome }}

      - name: Decide whether to publish
        id: publish
        if: always()
        timeout-minutes: 2
        run: |
          if [ "$MODE" = catchup ]; then
            if [ "${{ steps.save.outputs.open_list }}" = true ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          elif [ "${{ steps.add.outputs.markets }}" = true ] || { [ "${{ steps.save.outcome }}" = success ] && { [ "$MODE" = full ] || [ "${{ steps.decide.outcome }}" = success ]; }; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Fails the run only for a setup or code problem, one ::error:: line each; anything handled is a warning
      # and the run stays green (the setup check's own failure has already said why). It needs no package
      # (watchlist/problems.py is the standard library only), so it runs when the install failed too
      - name: Fail the run only for what a person must fix
        if: always() && steps.preflight.outcome != 'failure'
        timeout-minutes: 5
        env:
          BROKEN: ${{ steps.install.outputs.broken == 'true' && 'install' || '' }}
        run: |
          python3 -m watchlist.problems verdict --started-at "${{ steps.started.outputs.at }}" --broken "$BROKEN" \
            --outcome install=${{ steps.install.outcome }} --outcome pull=${{ steps.pull.outcome }} \
            --outcome work=${{ steps.work.outcome }} --outcome decide=${{ steps.decide.outcome }} \
            --outcome closed=${{ steps.closed.outcome }} --outcome open=${{ steps.open.outcome }} \
            --outcome save=${{ steps.save.outcome }} --outcome add=${{ steps.add.outcome }} \
            --outcome report=${{ steps.report.outcome }}

  deploy:
    needs: lists
    if: always() && needs.lists.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
      soft: true                        # PyPI or npm not answering leaves this deploy out instead of failing
    secrets:
      WATCHLIST_JOB_TOKEN: ${{ secrets.WATCHLIST_JOB_TOKEN }}
